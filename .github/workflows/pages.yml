name: Publish invitation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_SUBMISSIONS_ENABLED: ${{ vars.SUBMISSIONS_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure site address
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -n "$CUSTOM_SITE_URL" ]; then
            SITE_URL="${CUSTOM_SITE_URL%/}"
            BASE_PATH=""
          elif [ "${REPO,,}" = "$OWNER.github.io" ]; then
            SITE_URL="https://$OWNER.github.io"
            BASE_PATH=""
          else
            SITE_URL="https://$OWNER.github.io/$REPO"
            BASE_PATH="/$REPO"
          fi
          echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:export
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
